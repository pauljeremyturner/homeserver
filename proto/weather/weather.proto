syntax = "proto3";

package weather;

option go_package = "homeserver/gen/weather";

service WeatherService {
  // StreamWeather pushes a new WeatherUpdate whenever the server refreshes
  // its data (currently every 15 minutes), immediately sending the last
  // known value on subscribe if one exists.
  rpc StreamWeather(StreamWeatherRequest) returns (stream WeatherUpdate);
}

message StreamWeatherRequest {}

// Category buckets wttr.in's WorldWeatherOnline condition codes into a
// handful of icon/display groups. The server does the bucketing so clients
// never need to know wttr.in's raw numeric code scheme.
enum Category {
  CATEGORY_UNKNOWN = 0;
  CATEGORY_SUNNY = 1;
  CATEGORY_PARTLY_CLOUDY = 2;
  CATEGORY_CLOUDY = 3;
  CATEGORY_FOG = 4;
  CATEGORY_RAIN = 5;
  CATEGORY_THUNDER = 6;
  CATEGORY_SNOW = 7;
  CATEGORY_SLEET = 8;
}

enum MoonPhase {
  MOON_PHASE_UNKNOWN = 0;
  MOON_PHASE_NEW_MOON = 1;
  MOON_PHASE_WAXING_CRESCENT = 2;
  MOON_PHASE_FIRST_QUARTER = 3;
  MOON_PHASE_WAXING_GIBBOUS = 4;
  MOON_PHASE_FULL_MOON = 5;
  MOON_PHASE_WANING_GIBBOUS = 6;
  MOON_PHASE_LAST_QUARTER = 7;
  MOON_PHASE_WANING_CRESCENT = 8;
}

message WeatherUpdate {
  int64 fetched_at_unix = 1;

  string location = 2;

  string current_desc = 3;
  Category current_category = 4;
  string temp_c = 5;
  string feels_like_c = 6;
  string humidity = 7;
  string wind_kmph = 8;
  string wind_dir = 9;
  string uv_index = 10;
  string visibility_km = 11;

  string today_sunrise = 12;
  string today_sunset = 13;
  MoonPhase moon_phase = 14;
  string moon_illum = 15;

  // 16-21 were tomorrow_desc, tomorrow_category, tomorrow_max_c,
  // tomorrow_min_c, tomorrow_wind_kmph and tomorrow_chance_of_rain, replaced
  // by daily[1].
  reserved 16 to 21;
  reserved "tomorrow_desc", "tomorrow_category", "tomorrow_max_c",
      "tomorrow_min_c", "tomorrow_wind_kmph", "tomorrow_chance_of_rain";

  // wind_beaufort is the Beaufort scale name for wind_kmph ("Light breeze"),
  // empty if the speed couldn't be parsed.
  string wind_beaufort = 22;
  // tomorrow_sunrise lets clients show the next sunrise once today's sun has
  // set.
  string tomorrow_sunrise = 23;
  // timezone is the IANA name ("Europe/London") for the weather location,
  // so clients can show its local time whatever their own clock is set to.
  // Empty if it couldn't be looked up.
  string timezone = 24;

  // is_day says whether it's daytime now, for a day or night icon.
  bool is_day = 25;
  // hourly is the forecast for the next 24 hours, starting with the current
  // hour. Empty if the forecast couldn't be fetched.
  repeated HourForecast hourly = 26;
  // daily is the forecast for 7 days, starting today. Empty if the forecast
  // couldn't be fetched.
  repeated DayForecast daily = 27;
  // moon_passes are the Moon's times above the horizon at the location:
  // the one under way now (if it's up), then each rising in the next two
  // days. Empty if the location is unknown.
  repeated MoonPass moon_passes = 28;
}

message MoonPass {
  int64 rise_unix = 1;
  int64 set_unix = 2;
}

message HourForecast {
  // time_unix is the start of the hour.
  int64 time_unix = 1;
  Category category = 2;
  bool is_day = 3;
  int32 temp_c = 4;
  // chance_of_rain is the probability of precipitation, 0-100.
  int32 chance_of_rain = 5;
}

message DayForecast {
  // date is the local date at the weather location, "2006-01-02".
  string date = 1;
  // day_category is the worst weather from 06:00 to 18:00, night_category
  // the worst from 18:00 to 06:00 the next morning.
  Category day_category = 2;
  Category night_category = 3;
  int32 max_c = 4;
  int32 min_c = 5;
  // chance_of_rain is the day's highest hourly probability of precipitation.
  int32 chance_of_rain = 6;
}
