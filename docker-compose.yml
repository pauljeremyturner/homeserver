services:
  # lscr.io/linuxserver/minidlna was retired upstream (registry now returns
  # "denied" for the repo — it no longer exists), so Plex replaces it as the
  # media source. Its DLNA server (Settings > Network > Enable DLNA server,
  # in the web UI) covers the same role.
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host # required for Plex/DLNA discovery (GDM) to work on the LAN
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      # Optional: a claim token from https://plex.tv/claim (valid ~4 minutes)
      # to auto-link this server to your Plex account on first run. Leave
      # empty to instead complete setup manually via the web UI at
      # http://<host>:32400/web the first time it starts.
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./config/plex:/config:Z
      - /home/paul/Music:/music:z # shared label so host-side copies (sftp/filebrowser) stay readable
    restart: unless-stopped

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    network_mode: host # keeps real client IPs for per-device stats (bridge/NAT hides them behind the docker gateway)
    cap_add:
      - NET_ADMIN # recommended by upstream, not strictly required since we're not using Pi-hole's DHCP server
    environment:
      - TZ=${TZ}
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}
    volumes:
      - ./config/pihole/etc-pihole:/etc/pihole:Z
      - ./config/pihole/etc-dnsmasq.d:/etc/dnsmasq.d:Z
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    ports:
      - 8080:80
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/filebrowser:/config:Z
      - ./config/filebrowser/database:/database:Z # the image declares /database as a VOLUME — bind it so the user DB survives `compose down`
      - /home/paul/content:/srv:Z # placeholder — tweak later
    restart: unless-stopped

  nowplaying:
    build:
      context: .
      dockerfile: cmd/nowplaying/Dockerfile
    container_name: nowplaying
    ports:
      - 8090:8090
    environment:
      # Renderer target is env-driven — swapping devices is just changing
      # these two values, no code change.
      - RENDERER_CONTROL_URL=${RENDERER_CONTROL_URL}
      - RENDERER_SERVICE_TYPE=${RENDERER_SERVICE_TYPE}
      - POLL_INTERVAL_SECONDS=${NOWPLAYING_POLL_INTERVAL_SECONDS}
      # Album art fallback: Plex's DLNA art links go stale (401) across Plex
      # restarts, so nowplaying looks the album up via the Plex API instead.
      # Token = PlexOnlineToken in config/plex/.../Preferences.xml.
      - PLEX_URL=http://host.docker.internal:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
    extra_hosts:
      - host.docker.internal:host-gateway # Plex runs with network_mode: host
    restart: unless-stopped

  info-server:
    build:
      context: .
      dockerfile: cmd/info-server/Dockerfile
    container_name: info-server
    ports:
      - 9090:9090
    environment:
      # Optional: showing a BTC wallet balance in the crypto stream. Leave
      # WALLET_BTC_ADDRESS unset to disable it entirely (see .env.example).
      - WALLET_BTC_ADDRESS=${WALLET_BTC_ADDRESS}
      - WALLET_BTC_LABEL=${WALLET_BTC_LABEL}
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:lts # CE is the free tier; "lts" tracks stable releases (no "latest" tag is published)
    container_name: portainer
    security_opt:
      - label:disable # Portainer needs to manage the host's Docker daemon over its socket — :z alone fixes the socket file's label but SELinux still denies "connectto" against the daemon's own container_runtime_t domain, since that's specifically a privileged-container operation
    ports:
      - 8000:8000 # edge agent tunnel, optional but harmless to expose
      - 9443:9443 # web UI (HTTPS)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/portainer:/data:Z
    restart: unless-stopped
