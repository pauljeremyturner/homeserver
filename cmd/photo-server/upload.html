<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111">
<title>Add photos</title>
<style>
  :root { color-scheme: dark; --bg: #111; --card: #1d1d1d; --fg: #eee; --dim: #999; --ok: #5c5; --bad: #e66; --accent: #4a8fe7; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 17px/1.4 system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 4px 0 4px; }
  p { color: var(--dim); margin: 0 0 16px; }
  label.pick { display: block; padding: 22px; border-radius: 14px; background: var(--accent); color: #fff; text-align: center; font-size: 20px; font-weight: 600; }
  input[type=file] { display: none; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; }
  li { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 12px; padding: 8px; }
  li img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; background: #333; }
  .info { min-width: 0; flex: 1; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { font-size: 14px; color: var(--dim); }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  progress { width: 100%; height: 6px; accent-color: var(--accent); }
</style>
</head>
<body>
<h1>Add photos to the frame</h1>
<p>Each new photo is shown next on the photo frame.</p>
<label class="pick">Choose photos<input id="files" type="file" accept="image/*" multiple></label>
<ul id="list"></ul>
<script>
const list = document.getElementById('list');
const input = document.getElementById('files');
let queue = Promise.resolve();

input.addEventListener('change', () => {
  for (const file of input.files) {
    const row = addRow(file);
    // One at a time: phones on wifi do better than with many at once.
    queue = queue.then(() => upload(file, row));
  }
  input.value = '';
});

function addRow(file) {
  const li = document.createElement('li');
  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  img.onload = () => URL.revokeObjectURL(img.src);
  const info = document.createElement('div');
  info.className = 'info';
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = file.name;
  const status = document.createElement('div');
  status.className = 'status';
  status.textContent = 'Waiting';
  const bar = document.createElement('progress');
  bar.max = 1; bar.value = 0;
  info.append(name, status, bar);
  li.append(img, info);
  list.prepend(li);
  return { status, bar };
}

function upload(file, row) {
  return new Promise(resolve => {
    const done = (ok, text) => {
      row.status.textContent = text;
      row.status.className = 'status ' + (ok ? 'ok' : 'bad');
      row.bar.remove();
      resolve();
    };
    const form = new FormData();
    form.append('photo', file);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'upload');
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        row.bar.value = e.loaded / e.total;
        row.status.textContent = 'Uploading ' + Math.round(100 * e.loaded / e.total) + '%';
      }
    };
    xhr.onload = () => {
      let res;
      try { res = JSON.parse(xhr.responseText)[0]; } catch (_) {}
      if (xhr.status !== 200 || !res) return done(false, 'Failed: ' + (xhr.responseText || xhr.status));
      if (res.error) return done(false, 'Failed: ' + res.error);
      done(true, 'Added');
    };
    xhr.onerror = () => done(false, 'Failed: no connection');
    row.status.textContent = 'Uploading';
    xhr.send(form);
  });
}
</script>
</body>
</html>
